name: Build Legendary Disco Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Install Android export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -O templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q templates.tpz -d templates
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          cp templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/ || true

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Legendary-Disco.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Legendary-Disco-Android-APK
          path: build/Legendary-Disco.apk
