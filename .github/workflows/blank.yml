name: Build Legendary Disco Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare project
        run: |
          chmod -R u+rwX .
          mkdir -p build "$HOME/.android"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Install export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -O templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q templates.tpz -d templates
          cp templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Import project
        run: |
          godot --headless --path . --editor --quit

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.home }}/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          godot --headless --path . --export-debug "Android" build/Legendary-Disco.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Legendary-Disco-Android-APK
          path: build/Legendary-Disco.apk
